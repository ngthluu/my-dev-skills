name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to publish or recover
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: published-releases
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate release tag matches plugin versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: uv run scripts/version.py validate "$RELEASE_TAG"
      - run: uv sync --frozen
      - name: Validate committed tag, run required tests, publish, and reconcile latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: uv run scripts/release.py "$RELEASE_TAG"
