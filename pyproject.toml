[project]
name = "my-dev-skills-checks"
version = "0.0.0"
description = "Maintainer checks and release tooling for my-dev-skills"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
